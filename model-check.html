<!doctype html><meta charset="utf-8"><title>本地手部模型检查</title><body style="background:#151b26;color:#ddd;padding:50px;font:20px sans-serif"><h1>识别模型自检</h1><p id="status">正在载入 WebAssembly 与手部模型…</p><script type="module">const w=new Worker('./hand-worker.js');w.onmessage=async({data})=>{if(data.type==='ready'){document.querySelector('#status').textContent='模型已初始化，正在验证视频帧推理…';const c=document.createElement('canvas');c.width=640;c.height=480;const g=c.getContext('2d');g.fillStyle='#222';g.fillRect(0,0,640,480);const frame=await createImageBitmap(c);w.postMessage({type:'frame',frame,time:performance.now()},[frame])}else{document.querySelector('#status').textContent=data.type==='result'?'通过：本地模型初始化与视频帧推理均正常。空白帧无手掌，结果符合预期。':`失败：${data.message}`;w.terminate()}};w.onerror=e=>document.querySelector('#status').textContent='失败：'+e.message;w.postMessage({type:'init'});</script>
